<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Blood Hockey — WebAssembly</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #ffffff;
    }

    #canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      z-index: 10;
      transition: opacity 0.2s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    #loading-progress {
      font-family: monospace;
      font-size: 14px;
      color: #ffffff;
      text-align: center;
      user-select: none;
      letter-spacing: 0.5px;
    }

    #fps-counter {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-family: monospace;
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 5;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="return false;"></canvas>

  <div id="loading">
    <div id="loading-progress">Loading: 0 / 277 (0%)</div>
  </div>

  <div id="fps-counter">-- FPS</div>

  <script type="module" src="main.js"></script>

</body>
</html>
